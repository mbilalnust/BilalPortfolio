<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Portfolio of Bilal Muhammad - Data Scientist" />
    <title>Bilal Muhammad - Portfolio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // bilalcustom design system. One accent, no second brand color.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0066cc',        // Action Blue — every interactive element
              'primary-focus': '#0071e3',
              'primary-on-dark': '#2997ff', // dark tiles only
              parchment: '#f5f5f7',
              pearl: '#fafafc',
              tile1: '#272729',
              tile2: '#2a2a2c',
              tile3: '#252527',
              ink: '#1d1d1f',
              'ink-80': '#333333',
              'ink-48': '#7a7a7a',
              'body-muted': '#cccccc',
              hairline: '#e0e0e0',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            },
            fontSize: {
              // 17px body, not 16 — defines the reading pace
              body:      ['17px', { lineHeight: '1.44', letterSpacing: '-0.374px' }],
              caption:   ['14px', { lineHeight: '1.43', letterSpacing: '-0.224px' }],
              tagline:   ['21px', { lineHeight: '1.19', letterSpacing: '0.231px' }],
              lead:      ['28px', { lineHeight: '1.14', letterSpacing: '0.196px' }],
              'lead-airy':['24px',{ lineHeight: '1.5',  letterSpacing: '0' }],
              'display-md':['34px',{ lineHeight: '1.2', letterSpacing: '-0.374px' }],
              'display-lg':['40px',{ lineHeight: '1.10',letterSpacing: '-0.4px' }],
              hero:      ['56px', { lineHeight: '1.07', letterSpacing: '-0.56px' }],
              'fine-print':['12px',{ lineHeight: '1.4', letterSpacing: '-0.12px' }],
            },
            spacing: { section: '80px' },
            borderRadius: { card: '18px' },
            boxShadow: {
              // The ONE shadow in the system. Photographic elements only.
              product: 'rgba(0,0,0,0.22) 3px 5px 30px 0',
            },
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 17px;
        line-height: 1.44;
        letter-spacing: -0.374px;
      }
      /* Weight 500 is deliberately absent from this system: 300/400/600/700. */
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up { animation: fade-in-up 0.3s ease-out; }
      /* System-wide press micro-interaction */
      .press:active { transform: scale(0.95); }
      .press { transition: transform 0.12s ease; }
    </style>
</head>
  <body class="bg-white text-ink antialiased">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
